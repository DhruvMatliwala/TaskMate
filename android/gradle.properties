# Allocate 2.5 GB max heap and 512 MB Metaspace to leave room for Windows and Flutter
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Performance & concurrency flags
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin specific flags
# Disabling incremental compilation to ensure compatibility with redirected build paths on Windows
kotlin.incremental=false
kotlin.incremental.js=false

# Standard Flutter/Android flags
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
