name: taskmate
description: TaskMate — Hyper-local gig economy app connecting task creators with nearby workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.3

  # Google Maps & Location
  google_maps_flutter: ^2.7.0
  google_maps_flutter_web: ^0.5.7
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
